# 构建带 kcptun 加速插件的 Windows 安装包（NSIS）。
# Tauri 的 windows-msvc 工具链在 Linux/WSL 本机交叉编译极不稳定（需 cargo-xwin + xwin SDK + makensis），
# 因此 Windows 出包走此 CI（windows-latest 原生工具链）。手动触发即可。
name: Windows Build (with kcptun)

on:
  workflow_dispatch:
    inputs:
      kcptun_repo:
        description: 'kcptun 源码仓库 (owner/repo)，client 二进制由此交叉编译'
        required: true
        default: 'xtaci/kcptun'
      kcptun_ref:
        description: 'kcptun 分支/标签'
        required: false
        default: 'master'

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - name: Checkout clash-verge-rev
        uses: actions/checkout@v4

      - name: Checkout kcptun (sidecar 源码)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.kcptun_repo }}
          ref: ${{ github.event.inputs.kcptun_ref }}
          path: kcptun-src

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install

      - name: Prebuild sidecars (mihomo + kcptun client)
        env:
          # 让 prebuild.mjs 的 kcptun task 从此处构建 client，而非默认的 ../kcptun
          KCPTUN_SRC: ${{ github.workspace }}/kcptun-src
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build (Windows NSIS)
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-kcptun-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip
          if-no-files-found: warn
